[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backlash"
version = "0.5.1"
description = "Interactive in-browser debugger and error reporting middleware for WSGI and ASGI applications"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Alessandro Molina", email = "alessandro@molina.fyi" }
]
keywords = ["wsgi", "asgi", "debugger", "web"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
  "Topic :: Internet :: WWW/HTTP :: WSGI",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.optional-dependencies]
testing = [
  "pytest",
  "starlette"
]

[project.urls]
Homepage = "https://github.com/TurboGears/backlash"
Repository = "https://github.com/TurboGears/backlash"
Issues = "https://github.com/TurboGears/backlash/issues"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = ["examples", "tests"]

[tool.setuptools.package-data]
backlash = ["statics/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py39"
output-format = "grouped"
exclude = ["build", "dist", ".venv", "venv", "env", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001"]
